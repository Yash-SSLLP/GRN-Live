# ── Fix for: login returns "405 Not Allowed" / /api returns the HTML page ──
#
# Symptom: Nginx serves the React build fine, but /api/* is caught by the SPA
# static fallback instead of the Node backend, so POST /api/auth/login -> 405.
#
# Cause: no reverse-proxy for /api and /socket.io.
#
# Fix: paste these TWO location blocks INSIDE your existing `server { ... }` block
# for grn.salestracker.in (the HTTPS/:443 one), ABOVE the `location / { ... }`
# that serves the static files. Then: sudo nginx -t && sudo systemctl reload nginx
#
# Requires the Node backend running on 127.0.0.1:5000 (pm2 start ecosystem.config.cjs).

# REST API -> Node/Express (keeps the /api prefix; Express routes are /api/*)
location /api/ {
    proxy_pass http://127.0.0.1:5000;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 6m;   # Excel/PDF imports are posted as JSON (server allows 4mb)
}

# Socket.IO live sync -> Node, with the WebSocket upgrade headers
location /socket.io/ {
    proxy_pass http://127.0.0.1:5000;
    proxy_http_version 1.1;
    proxy_set_header Host       $host;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

# Your existing static/SPA block stays as-is, e.g.:
# location / {
#     root /var/www/grn/client/dist;   # wherever your build is
#     try_files $uri /index.html;
# }
